<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン MINT お弁当配達管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- 基本的な三行構造 -->
    <div class="flex flex-col min-h-screen">
        <!-- Row_00:Header -->
        <header class="bg-gray-200 p-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold">MINT お弁当配達管理システム
                    <span class="text-sm opacity-75">α1.0</span>
                </h1>
            </div>
        </header>

        <!-- Row_01:Center -->
        <!-- 中央行は三列に分かれる -->
        <!-- ログイン時はログイン項目のみ。 -->
        <main class="flex flex-col grow items-center">
            <form>
            名前：<input>
            <button>送信</button>
            <br>
            <br>

            <label>label要素あり：<input></label>
            <br>
            label要素なし：<input>
            </form>
            <br>

            <table border="1">
                <tr>
                    <td><label for="name">氏名</label></td>
                    <td><input id="name"></td>
                </tr>
            </table>
            <br>

            <button type="submit">送信</button>
            <button type="reset">クリア</button>
            <button type="button">ボタン</button>
            <br>



            <form action="#" class="p-4 text-center bg-gray-200">
                <div>-ログインフォーム-</div>
                <div>
                    <label for="test">名前</label>
                    <div>
                        <!-- [必須]アイコン -->
                    </div>
                    <input type="text" name="test" required>
                </div>
                <div>
                    <label for="Pass">パスワード</label>
                    <div>
                        <!-- [必須]アイコン -->
                    </div>
                    <input type="password" name="Pass" required>
                </div>
                <div>
                    <button type="submit" value="Submit">Submit</button>
                </div>
            </form>
            <div class="p-4 text-center">ID、パスワードはシステム管理者にお問い合わせください。</div>

            <!-- R01Col_00:Navigation -->
            <!-- ナビゲーションカラム。選択中のパネルはハイライト。マウスオーバーでハイライトされる -->
            <!-- ログイン時は表示されない -->


            <!-- R01Col_01:Main Control Panel -->
            <!-- 基本的な操作部分。 -->
            <!-- ログイン時は表示されない -->

            <!-- R01Col_02:Information -->
            <!-- ログイン時は表示されない -->
        </main>

        <!-- Row_02:Footer -->
        <footer class="bg-gray-200 p-4 text-center">
            &copy; 2024 MINT Corporation.
        </footer>
    </div>
</body>
</html>
