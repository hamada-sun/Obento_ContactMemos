<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン MINT お弁当配達管理システム</title>

    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <link rel="stylesheet" href="http://localhost:5173/resources/css/app.css">
</head>
<body>
    <!-- 基本的な三行構造 -->
    <div class="flex flex-col min-h-screen">
        <!-- Row_00:Header -->
        <header class="bg-gray-200 p-4">
            <div class="flex items-center space-x-4">
                <div class="bg-green-800">Logo</div>
                <h1 class="text-xl font-bold">MINT お弁当配達管理システム
                    <span class="text-sm opacity-75">α1.0</span>
                </h1>
            </div>
        </header>

        <!-- Row_01:Center -->
        <!-- 中央行は三列に分かれる -->
        <!-- ログイン時はログイン項目のみ。 -->
        <main class="flex flex-col grow items-center">
            <div>-ログインフォーム-</div>
            <form action="#" class="p-4 text-left">
                <label for="website-admin" class="block mb-2.5  text-heading">ユーザー名</label>
                <div class="flex shadow-xs rounded-base">
                    <span class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    </span>
                    <input type="text" id="website-admin" class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body" placeholder="ユーザー名" required>
                </div>
                <div class="mb-5">
                    <label for="password-alternative" class="block mb-2.5 text-heading">パスワード</label>
                    <input type="password" id="password-alternative" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow placeholder:text-body" placeholder="••••••••" required />
                </div>
                <button type="submit" class="text-green-600 bg-brand box-border border hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base px-4 py-2.5 focus:outline-none">Log In</button>
            </form>
            <div class="p-4 text-center">ID、パスワードはシステム管理者にお問い合わせください。</div>

            <!-- R01Col_00:Navigation -->
            <!-- ログイン時は表示されない -->

            <!-- R01Col_01:Main Control Panel -->
            <!-- ログイン時は表示されない -->

            <!-- R01Col_02:Information -->
            <!-- ログイン時は表示されない -->
        </main>

        <!-- Row_02:Footer -->
        <footer class="bg-gray-200 p-4 text-center">
            &copy; 2024 MINT Corporation.
        </footer>
    </div>
</body>
</html>
